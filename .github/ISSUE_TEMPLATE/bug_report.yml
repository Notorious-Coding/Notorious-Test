name: Bug Report
description: Report a bug or unexpected behaviour in NotoriousTest
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Create an environment with ...
        2. Run the test ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened? Include any error messages or stack traces.
    validations:
      required: true

  - type: dropdown
    id: framework
    attributes:
      label: Test framework
      options:
        - xUnit
        - NUnit
        - MSTest
        - TUnit
        - Not applicable
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: NotoriousTest version
      placeholder: e.g. 2.3.0
    validations:
      required: true

  - type: input
    id: dotnet-version
    attributes:
      label: .NET version
      placeholder: e.g. .NET 10
    validations:
      required: true

  - type: textarea
    id: reproduction-project
    attributes:
      label: Minimal reproduction project
      description: Link to a repository or a code snippet that reproduces the issue (optional but greatly appreciated).

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other information that might be relevant (OS, Docker version, CI environment, etc.).
