# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Release Worflow

on:
  release:
    types: [created] 
jobs:
  publish:
    env: 
      CONFIGURATION: 'Release'
      DOTNET_VERSION: '9.0'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration ${{ env.CONFIGURATION }} --no-restore

    - name: Publish DoggyDog for Windows
      run: |
        dotnet publish ./NotoriousTest.DoggyDog/NotoriousTest.DoggyDog.csproj \
            -r win-x64 \
            --self-contained \
            -p:PublishSingleFile=true \
            -o ./tools/win-x64 \
            --no-build

    - name: Publish DoggyDog for Linux
      run: |
        dotnet publish ./NotoriousTest.DoggyDog/NotoriousTest.DoggyDog.csproj \
            -r linux-x64 \
            --self-contained \
            -p:PublishSingleFile=true \
            -o ./tools/linux-x64 \
            --no-build

    - name: Test
      run: dotnet test NotoriousTest.UnitTests --no-build --verbosity normal
    
    - name: Run Integration Tests
      run: dotnet test NotoriousTest.IntegrationTests --no-build --verbosity normal
    - name: Pack
      run: dotnet pack -c ${{ env.CONFIGURATION }} -o out
    - name: Push
      run: dotnet nuget push out/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
