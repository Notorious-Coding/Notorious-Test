# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Release Worflow

on:
  release:
    types: [created] 
jobs:
  publish:
    env: 
      CONFIGURATION: 'Release'
      DOTNET_VERSION: '10.0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for NuGet trusted publishing (OIDC)
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    - name: Restore dependencies
      run: dotnet restore

    - name: Publish DoggyDog for Windows
      run: |
        dotnet publish ./DoggyDog/DoggyDog.csproj \
            -r win-x64 \
            --self-contained \
            -p:PublishSingleFile=true \
            -p:PublishDoggyDogToArtifactsOnBuild=false \
            -o ./artifacts/doggydog/win-x64

    - name: Publish DoggyDog for Linux
      run: |
        dotnet publish ./DoggyDog/DoggyDog.csproj \
            -r linux-x64 \
            --self-contained \
            -p:PublishSingleFile=true \
            -p:PublishDoggyDogToArtifactsOnBuild=false \
            -o ./artifacts/doggydog/linux-x64 \
            --no-restore

    - name: Build
      run: dotnet build NotoriousTest.NoDoggyDog.slnf --configuration ${{ env.CONFIGURATION }} --no-restore

    - name: Test
      run: dotnet test NotoriousTest.UnitTests --no-build --verbosity normal
    
    - name: Run Integration Tests
      run: dotnet test NotoriousTest.IntegrationTests --no-build --verbosity normal
    - name: Pack
      run: dotnet pack -c ${{ env.CONFIGURATION }} -o out
    - name: NuGet login (trusted publishing)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Push
      run: dotnet nuget push out/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate
